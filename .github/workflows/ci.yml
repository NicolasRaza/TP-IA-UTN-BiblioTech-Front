name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# La app Flutter vive en app/; en la raíz queda el prototipo HTML original.
defaults:
  run:
    working-directory: app

env:
  # Fijada a propósito: el código usa withOpacity, que 3.27+ reemplaza por
  # withValues. Subir de versión requiere migrar esas llamadas.
  FLUTTER_VERSION: 3.24.5

jobs:
  calidad:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Tests con cobertura
        run: flutter test --coverage

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: app/coverage/lcov.info
          if-no-files-found: warn

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar para web
        run: flutter build web --release

      - name: Publicar artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: bibliotech-web
          path: app/build/web
          retention-days: 14

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar APK de debug
        run: flutter build apk --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: bibliotech-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
