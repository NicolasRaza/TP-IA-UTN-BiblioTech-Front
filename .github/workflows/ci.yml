name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
    # Cada push a main etiqueta y publica un release con el APK; un tag
    # vX.Y.Z empujado a mano fuerza esa versión exacta.
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# La app Flutter vive en app/; en la raíz queda el prototipo HTML original.
defaults:
  run:
    working-directory: app

env:
  # Fijada a propósito: el código usa withOpacity, que 3.27+ reemplaza por
  # withValues. Subir de versión requiere migrar esas llamadas.
  FLUTTER_VERSION: 3.24.5

jobs:
  calidad:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Tests con cobertura
        run: flutter test --coverage

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: app/coverage/lcov.info
          if-no-files-found: warn

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar para web
        run: flutter build web --release

      - name: Publicar artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: bibliotech-web
          path: app/build/web
          retention-days: 14

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Release, no debug: es el APK que se instala en un teléfono para la
      # demo. Va firmado con las claves de debug que trae el template de
      # Flutter, así que se puede instalar de costado pero no publicar en
      # Play Store — suficiente para el TP.
      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: bibliotech-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  desplegar-pages:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: calidad
    # Solo desde main: develop es la rama de integración y no debería dejar
    # trabajo a medias publicado. Se promueve con un PR develop -> main.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Dos deploys simultáneos se pisan; el último en entrar gana.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Compilación propia, distinta de la del job build-web: Pages sirve el
      # sitio bajo /<repo>/, así que sin este base-href la página carga en
      # blanco porque busca los assets en la raíz del dominio. El artefacto
      # de build-web se deja sin base-href para que sirva en cualquier hosting.
      - name: Compilar para web con el base-href de Pages
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      - id: despliegue
        uses: actions/deploy-pages@v4

  publicar-release:
    name: Etiquetar y publicar el release
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    # Dos caminos hacia el mismo release. Cada push a main calcula la versión
    # siguiente, empuja el tag y publica; un tag vX.Y.Z empujado a mano respeta
    # ese nombre exacto, que es la única forma de subir el número mayor.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: la versión siguiente sale de los tags que ya
          # existen, y el clon superficial por defecto no los trae.
          fetch-depth: 0

      # Numeración: se parte del último tag vX.Y.Z y se mira de qué rama vino
      # el merge. fix/, hotfix/ y bugfix/ suben el parche (Z); develop —y
      # cualquier otra cosa que caiga en main— sube la menor (Y) y resetea Z.
      # La mayor (X) nunca se toca sola: para eso se empuja el tag a mano.
      - name: Calcular la versión
        id: version
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag empujado a mano: $GITHUB_REF_NAME"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # sed -n 1p en vez de head: head cierra el pipe antes de tiempo y con
          # pipefail eso haría fallar el paso.
          ultimo=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n 1p)

          if [[ -z "$ultimo" ]]; then
            echo "No hay tags todavía: primera publicación."
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Primero por la API, que resuelve el PR del commit aunque el merge
          # haya sido squash o rebase; si el commit no tiene PR asociado, se
          # lee la rama del mensaje del merge commit.
          rama=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                   --jq '.[0].head.ref // ""' 2>/dev/null || echo "")
          if [[ -z "$rama" ]]; then
            rama=$(git log -1 --pretty=%s \
                     | sed -n 's|^Merge pull request #[0-9]\+ from [^/]\+/||p')
          fi

          IFS=. read -r mayor menor parche <<< "${ultimo#v}"

          case "$rama" in
            fix/*|hotfix/*|bugfix/*) parche=$((parche + 1)) ;;
            *)                       menor=$((menor + 1)); parche=0 ;;
          esac

          echo "Último tag: $ultimo — rama mergeada: ${rama:-desconocida}"
          echo "version=v$mayor.$menor.$parche" >> "$GITHUB_OUTPUT"

      - name: Empujar el tag
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # El push va con el GITHUB_TOKEN, que a propósito no dispara otro run
          # del workflow. Por eso el release se crea acá abajo, en esta misma
          # corrida, y no en un run disparado por el tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "El tag $VERSION ya existe; no se vuelve a crear."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "BiblioTech $VERSION"
          git push origin "$VERSION"

      - name: Descargar el APK compilado
        uses: actions/download-artifact@v4
        with:
          name: bibliotech-apk
          path: apk

      - name: Descargar el build web
        uses: actions/download-artifact@v4
        with:
          name: bibliotech-web
          path: web

      - name: Empaquetar el build web
        run: zip -r bibliotech-web.zip web
        working-directory: ${{ github.workspace }}

      # Los artefactos de los jobs anteriores caducan y exigen estar logueado
      # en GitHub; un release da un link de descarga público y permanente, que
      # es lo que se cita en el informe.
      - name: Crear el release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "BiblioTech $VERSION" \
            --notes "Aplicación BiblioTech compilada desde el tag \`$VERSION\`.

          - \`app-release.apk\` — instalable en Android. Hay que habilitar la
            instalación desde orígenes desconocidos: está firmado con las claves
            de debug de Flutter, no con una clave de publicación.
          - \`bibliotech-web.zip\` — build web estático, servible desde cualquier
            hosting.

          Los datos son de demostración y se guardan en el dispositivo." \
            apk/app-release.apk \
            bibliotech-web.zip
