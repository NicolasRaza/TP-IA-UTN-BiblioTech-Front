name: bibliotech
description: "BiblioTech — Sistema de Gestión de Bibliotecas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Persistencia local multiplataforma (web: localStorage, mobile: SharedPreferences)
  shared_preferences: ^2.3.2
  # Estado de la aplicación
  provider: ^6.1.2
  # Formato de fechas y números en es-AR
  intl: ^0.19.0
  # Generación de códigos QR de ejemplares y lectores
  qr_flutter: ^4.1.0
  # Consulta a Open Library para enriquecimiento de fichas
  http: ^1.2.2
  # Gráficos del dashboard e informes
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
